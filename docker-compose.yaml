version: '3.8'
services:
  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: nestjs-app
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://myuser:mypass@db:5432/mydb"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
