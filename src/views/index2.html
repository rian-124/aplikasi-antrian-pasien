<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Daftar Users</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        padding: 10px;
        border: 1px solid #ccc;
        text-align: left;
      }
      th {
        background-color: #f3f3f3;
      }
    </style>
  </head>
  <body>
    <h1>Daftar Antrian pasiens</h1>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nama</th>
          <th>Email</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody id="user-table-body"></tbody>
    </table>

    <h1>Daftar Users</h1>
      <button onclick="playVoice('Nomor antrian 25, silakan menuju loket.')">
  Panggil Antrian
</button>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nama</th>
          <th>Email</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody id="user-table-body"></tbody>
    </table>

    <script>
      function playVoice(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID'; // bahasa Indonesia
        utterance.rate = 1; // kecepatan (0.5 - 2)
        utterance.pitch = 1; // nada suara (0 - 2)
        speechSynthesis.speak(utterance);
      }
    </script>

    <!-- test WebSocket -->
    <script>
      const token =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjgsInVzZXJuYW1lIjoiaGFkZXoxIiwicm9sZSI6IkFETUlOVVNFUlMiLCJvdXRsZXQiOiJHRURVTkcgQSIsInBlcm1pc3Npb24iOlsidmlldzpBRE1JTlVTRVJTIl0sImlhdCI6MTc1NzM5ODM0OCwiZXhwIjoxNzU3NDAxOTQ4fQ.E72MZX-02IZGU2mXZq629N34LHTNh8SwHCTN7CZwZqE';

      async function loadUsers() {
        try {
          const res = await fetch('http://localhost:3000/api/antrian-pasien', {
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
          });

          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const body = await res.json();
          renderNomorAntrian(body.data);
        } catch (err) {
          console.error('Gagal load users:', err.message);
          if (err.message.includes('401')) {
            alert('Sesi kadaluwarsa. Silakan login kembali.');
            window.location.href = '/login.html';
          }
        }
      }

      loadUsers();

      const tbody = document.getElementById('user-table-body');
      function renderNomorAntrian(users) {

        const filtered = users.filter(u => u.status_antrian_id === 1);

        tbody.innerHTML = '';
        users.forEach((u) => {

          const tr = document.createElement('tr');
          tr.dataset.id = u.id;
          tr.innerHTML = `
          <td>${u.nomor_Antrian}</td>
          <td>${u.bintang}</td>
          <td>${filtered}</td>
        `;
          tbody.appendChild(tr);
        });
      }

      const socket = io('http://localhost:3000', {
        auth: { token },
      });

      socket.on('connect', () => {
        console.log('Terhubung ke WebSocket');
        socket.emit('join_room', { role: 'ADMINUSERS' });
      });

      socket.on('connect_error', (err) => {
        console.error('Gagal konek WebSocket:', err.message);
      });

      socket.on('antrian_pasiens_update', (data) => {
        console.log('antrian pasien update diterima:', data);
        updatePasienRow(data);
      });

      function updatePasienRow(u) {
  const row = document.querySelector(`tr[data-id="${u.id}"]`);
  if (row) {
    row.querySelector('td:nth-child(1)').textContent = u.nomor_Antrian;
    row.querySelector('td:nth-child(2)').textContent = u.bintang;
    row.querySelector('td:nth-child(3)').textContent = u.status_antrian_id;
    row.querySelector('td:nth-child(4)').textContent = u.users?.name || '-';
  } else {
    const tr = document.createElement('tr');
    tr.dataset.id = u.id;
    tr.innerHTML = `
      <td>${u.nomor_Antrian}</td>
      <td>${u.bintang}</td>
      <td>${u.status_antrian_id}</td>
      <td>${u.users?.name || '-'}</td>
    `;
    tbody.appendChild(tr);
  }
}
    </script>
  </body>
</html>
