    <script>
      function playVoice(text, number, pauseMs = 500) {
        const utter1 = new SpeechSynthesisUtterance(text);
        utter1.lang = 'id-ID';

        const utter2 = new SpeechSynthesisUtterance(number.toString());
        utter2.lang = 'id-ID';
        utter2.rate = 0.5;

        utter1.onend = () => {
          setTimeout(() => {
            speechSynthesis.speak(utter2);
          }, pauseMs);
        };

        speechSynthesis.speak(utter1);
      }
    </script>
